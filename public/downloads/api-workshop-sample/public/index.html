<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나의 첫 AI 질문 앱</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">BEGINNER AI API</p>
      <h1>나의 첫 AI 질문 앱</h1>
      <p>질문을 입력하면 서버가 OpenAI API에 안전하게 전달합니다.</p>
      <form id="ask-form">
        <label for="message">AI에게 물어볼 내용</label>
        <textarea id="message" rows="5" placeholder="예: 초보자를 위한 부산 여행 코스를 추천해 줘" required></textarea>
        <button type="submit">AI에게 질문하기</button>
      </form>
      <section aria-live="polite" aria-busy="false">
        <strong>AI 답변</strong>
        <p id="answer">여기에 답변이 표시됩니다.</p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
